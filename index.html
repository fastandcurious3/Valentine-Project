<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?🥹💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- First GIF -->
        <img src="gif1.gif" id="firstGif" alt="First GIF" class="gif">

        <!-- Prompt Text -->
        <h2 id="promptText">Will you be my Valentine?🥹💕</h2>

        <!-- Buttons (Yes first, No second) -->
        <div class="buttons">
            <button id="yesButton">Yes</button>
            <button id="noButton">No</button>
        </div>

        <!-- Second GIF after "Yes" -->
        <img src="gif2.gif" id="secondGif" alt="Second GIF" class="gif" style="display:none;">
        
        <!-- Final Message -->
        <h3 id="finalMessage" style="display:none;">Yay, I knew you'd say yes!🤭 I love you so much!😚❤️</h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
